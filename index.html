<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 音乐下载器 - Web版</title>
    <link rel="stylesheet" href="static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="logo">
                <span class="logo-icon">🎵</span>
                <h1>音乐下载器</h1>
            </div>
            <p class="subtitle">多源音乐搜索与下载 | 下载后自动删除服务器文件</p>
        </header>

        <main class="main-content">
            <section class="search-section">
                <div class="search-box">
                    <div class="source-selector">
                        <label>选择音乐源：</label>
                        <div class="source-chips" id="sourceChips">
                            <label class="chip active">
                                <input type="checkbox" value="NeteaseMusicClient" checked>
                                <span>网易云</span>
                            </label>
                            <label class="chip">
                                <input type="checkbox" value="QQMusicClient">
                                <span>QQ音乐</span>
                            </label>
                            <label class="chip active">
                                <input type="checkbox" value="KugouMusicClient" checked>
                                <span>酷狗</span>
                            </label>
                            <label class="chip active">
                                <input type="checkbox" value="KuwoMusicClient" checked>
                                <span>酷我</span>
                            </label>
                            <label class="chip">
                                <input type="checkbox" value="MiguMusicClient">
                                <span>咪咕</span>
                            </label>
                        </div>
                    </div>

                    <div class="search-input-wrapper">
                        <input type="text" id="searchInput" placeholder="输入歌曲名、歌手或关键词..." autocomplete="off">
                        <button id="searchBtn" class="btn-search">
                            <span class="btn-icon">🔍</span>
                            <span class="btn-text">搜索</span>
                        </button>
                    </div>
                </div>
            </section>

            <section class="results-section" id="resultsSection">
                <div class="results-header">
                    <h2>搜索结果</h2>
                    <div class="results-actions">
                        <button id="selectAllBtn" class="btn-secondary" disabled>全选</button>
                        <button id="downloadSelectedBtn" class="btn-primary" disabled>
                            <span class="btn-icon">⬇️</span>
                            <span class="btn-text">下载选中</span>
                        </button>
                    </div>
                </div>

                <div class="results-list" id="resultsList">
                    <div class="empty-state" id="emptyState">
                        <div class="empty-icon">🎶</div>
                        <p>输入关键词开始搜索音乐</p>
                    </div>
                </div>
            </section>
        </main>

        <div class="loading-overlay" id="loadingOverlay">
            <div class="loading-spinner">
                <div class="spinner"></div>
                <p id="loadingText">加载中...</p>
            </div>
        </div>

        <div class="toast-container" id="toastContainer"></div>
    </div>

    <script src="static/app.js"></script>
</body>
</html>
